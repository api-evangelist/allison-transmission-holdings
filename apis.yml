image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
description: >-
  Allison Transmission Holdings is a designer and manufacturer of fully automatic
  transmissions for medium- and heavy-duty commercial vehicles and medium- and heavy-tactical
  military vehicles. The company offers connected vehicle services through the Allison
  Connected Services platform, providing telematics and diagnostic data integration for
  fleet operators and OEM vehicle manufacturers.
